client localhost {
        ipaddr = 127.0.0.1
        proto = *
        secret = testing123
        limit {
                max_connections = 16
                lifetime = 0
                idle_timeout = 900
        }
}
client localhost_ipv6 {
        ipv6addr        = ::1
        secret          = testing123
}

client flr-1 {
        ipaddr = <ip-address-flr1>
        netmask = 32
        secret = <SECRET>
        require_message_authenticator = no
        shortname = flr-1
        nastype = other
        virtual_server = eduroam
}

client flr-2 {
        ipaddr = <ip-address-flr2>
        netmask = 32
        secret = <SECRET>
        require_message_authenticator = no
        shortname = flr-2
        nastype = other
        virtual_server = eduroam
}